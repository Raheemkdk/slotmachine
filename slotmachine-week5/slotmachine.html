<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/slotmachine.css">
    <title>Slot Machine</title>
</head>

<body>

    <section class="casinoBody">
        <h1>Slot-Machine!!</h1>
        <section class="slotVisual">
            <div id="rel1"class="slotScreens">👑</div>
            <div id="rel2" class="slotScreens">🍑</div>
            <div id="rel3" class="slotScreens">🍒</div>
        </section>
        <section class="buttonSection">
            <input id="bet"type="button" value="Enter A Bet Amount">
            <button id="min" type="submit">$5</button>
            <button id="max" type="submit">$50</button>
            <input id="spinButton"type="button" value="SPIN">
        </section>
        <h2 id="outputText"></h2>
        <p id="wallet"></p>
    </section>
    <script src="js/slotmachine.js"></script>
</body>
</html>
